<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f120e">
<title>Join this class · Cadet Foundry</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root { --bg: #0f120e; --card: #1a2017; --line: #2c3526; --text: #ece6d6; --muted: #a7a08c; --tan: #cdb57c; --red: #e07a6a; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 28px 16px 40px; }
h1 { font-size: clamp(30px, 5vw, 52px); margin: 0 0 6px; }
.lead { color: var(--muted); margin: 0 0 22px; font-size: 20px; }
.grid { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
.qr { background: #fff; border-radius: 14px; padding: 10px; line-height: 0; justify-self: center; }
.qr svg { width: min(360px, 80vw); height: auto; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
.addr { font: 700 clamp(24px, 3.4vw, 36px) ui-monospace, Consolas, monospace; color: var(--tan); word-break: break-all; user-select: all; }
.code { font: 700 clamp(34px, 5vw, 54px) ui-monospace, Consolas, monospace; letter-spacing: .18em; color: var(--tan); }
ol { margin: 0; padding-left: 26px; } ol li { margin: 8px 0; }
.faint { color: var(--muted); font-size: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button, a.btn, select { font: inherit; min-height: 48px; padding: 8px 18px; border-radius: 10px; border: 1px solid var(--line); background: #212819; color: var(--text); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
button.primary { background: var(--tan); color: #1a1a12; border-color: var(--tan); font-weight: 700; }
button.end { border-color: var(--red); color: var(--red); }
a.primary-link { background: var(--tan); color: #1a1a12; border-color: var(--tan); font-weight: 700; }
.warn { border-color: #8a6d2c; }
.big { font-size: 26px; font-weight: 700; }
</style>
</head>
<body>
<main id="join"><p class="faint">Loading…</p></main>
<script src="/js/qr.js"></script>
<script src="/js/join.js"></script>
</body>
</html>
