<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Vanguard app icon: a 7.62 mm round in army green on black -->
  <defs>
    <linearGradient id="case" x1="0" x2="1">
      <stop offset="0" stop-color="#3a4119"/><stop offset=".35" stop-color="#6b7a3a"/><stop offset=".55" stop-color="#4b5320"/><stop offset="1" stop-color="#2b3012"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" x2="1">
      <stop offset="0" stop-color="#1c1f12"/><stop offset=".4" stop-color="#3d4424"/><stop offset="1" stop-color="#14160c"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="124" fill="#0c0d0a"/>
  <circle cx="128" cy="128" r="114" fill="none" stroke="#4b5320" stroke-width="5"/>
  <g transform="rotate(35 128 128)">
    <!-- bullet -->
    <path d="M128 30 C134 46 141 70 141 98 L115 98 C115 70 122 46 128 30 Z" fill="url(#tip)" stroke="#6b7a3a" stroke-width="2"/>
    <!-- case: neck, shoulder, body -->
    <path d="M114 98 L142 98 L142 114 L147 126 L146 210 L110 210 L109 126 L114 114 Z" fill="url(#case)"/>
    <!-- extraction groove and rim -->
    <path d="M113 210 L143 210 L141 216 L115 216 Z" fill="#1d2010"/>
    <rect x="109" y="216" width="38" height="11" rx="2" fill="url(#case)"/>
    <path d="M114 98 L142 98" stroke="#1d2010" stroke-width="2"/>
  </g>
</svg>
